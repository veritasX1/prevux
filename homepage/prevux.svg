<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#2b6fe0"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3ff"/>
      <stop offset="1" stop-color="#d9efff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b2a66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- page -->
  <g filter="url(#shadow)">
    <path d="M34 22 H80 L98 40 V104 a4 4 0 0 1 -4 4 H34 a4 4 0 0 1 -4 -4 V26 a4 4 0 0 1 4 -4 Z" fill="#ffffff"/>
    <path d="M80 22 V36 a4 4 0 0 0 4 4 H98 Z" fill="#dbe6f5"/>
  </g>
  <!-- photo on the page -->
  <rect x="40" y="46" width="48" height="30" rx="3" fill="url(#photo)"/>
  <circle cx="77" cy="54" r="4.5" fill="#ffd23f"/>
  <path d="M40 76 L55 60 L64 69 L71 63 L88 76 Z" fill="#3e9b5f"/>
  <!-- text lines -->
  <rect x="40" y="84" width="48" height="4" rx="2" fill="#c3cfdf"/>
  <rect x="40" y="94" width="34" height="4" rx="2" fill="#c3cfdf"/>
  <!-- marker stroke -->
  <path d="M38 86 H76" stroke="#ffd23f" stroke-width="9" stroke-linecap="round" opacity="0.75" style="mix-blend-mode:multiply"/>
  <!-- pen -->
  <g transform="rotate(40 96 88)">
    <rect x="90" y="52" width="12" height="44" rx="3" fill="#ff9f0a"/>
    <rect x="90" y="52" width="12" height="9" rx="3" fill="#e0e5ee"/>
    <path d="M90 96 H102 L96 108 Z" fill="#f4d9b0"/>
    <path d="M94 104 H98 L96 108 Z" fill="#333"/>
  </g>
</svg>
